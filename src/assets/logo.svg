<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    
    <!-- Drop Shadow for Calendar Card -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <!-- Subtle Inner Grid Item Glow / Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Base Calendar Container with Smooth Rounded Corners -->
  <rect x="32" y="56" width="448" height="424" rx="72" ry="72" fill="url(#bgGrad)" filter="url(#cardShadow)" />

  <!-- Top Rings/Hangers -->
  <rect x="124" y="24" width="36" height="60" rx="18" fill="#2563EB" />
  <rect x="352" y="24" width="36" height="60" rx="18" fill="#2563EB" />
  
  <rect x="130" y="30" width="24" height="48" rx="12" fill="#3B82F6" />
  <rect x="358" y="30" width="24" height="48" rx="12" fill="#3B82F6" />

  <!-- Header Dots / Binder Knobs -->
  <circle cx="142" cy="100" r="16" fill="#1E293B" opacity="0.85" />
  <circle cx="370" cy="100" r="16" fill="#1E293B" opacity="0.85" />

  <!-- 3x3 Calendar Grid Tiles -->
  <!-- Row 1 -->
  <rect x="80" y="150" width="80" height="70" rx="18" fill="#FFFFFF" />
  <rect x="352" y="150" width="80" height="70" rx="18" fill="#FFFFFF" />

  <!-- Row 2 -->
  <rect x="80" y="246" width="80" height="70" rx="18" fill="#FFFFFF" />
  <rect x="352" y="246" width="80" height="70" rx="18" fill="#FFFFFF" />

  <!-- Row 3 -->
  <rect x="80" y="342" width="80" height="70" rx="18" fill="#FFFFFF" />
  <rect x="352" y="342" width="80" height="70" rx="18" fill="#FFFFFF" />

  <!-- Central Refresh Cycle Arrows (White) -->
  <g filter="url(#softShadow)">
    <!-- Top Arc Arrow -->
    <path d="M 200,166 A 110,110 0 0,1 336,166 L 336,192 L 380,154 L 336,116 L 336,142 A 134,134 0 0,0 170,142 L 195,167 Z" fill="#FFFFFF" />
    
    <!-- Bottom Arc Arrow -->
    <path d="M 312,396 A 110,110 0 0,1 176,396 L 176,370 L 132,408 L 176,446 L 176,420 A 134,134 0 0,0 342,420 L 317,395 Z" fill="#FFFFFF" />
  </g>

  <!-- Central Clock Badge (White Disc) -->
  <circle cx="256" cy="281" r="74" fill="#FFFFFF" filter="url(#softShadow)" />

  <!-- Clock Hour Markers (Blue) -->
  <g fill="#2563EB">
    <circle cx="256" cy="223" r="5" />
    <circle cx="285" cy="231" r="5" />
    <circle cx="306" cy="252" r="5" />
    <circle cx="314" cy="281" r="5" />
    <circle cx="306" cy="310" r="5" />
    <circle cx="285" cy="331" r="5" />
    <circle cx="256" cy="339" r="5" />
    <circle cx="227" cy="331" r="5" />
    <circle cx="206" cy="310" r="5" />
    <circle cx="198" cy="281" r="5" />
    <circle cx="206" cy="252" r="5" />
    <circle cx="227" cy="231" r="5" />
  </g>

  <!-- Clock Hands (Blue) -->
  <path d="M 256,281 L 256,239" stroke="#2563EB" stroke-width="12" stroke-linecap="round" />
  <path d="M 256,281 L 286,281" stroke="#2563EB" stroke-width="12" stroke-linecap="round" />
  <circle cx="256" cy="281" r="8" fill="#2563EB" />
</svg>
